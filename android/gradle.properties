org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Flutter 3.47 floors Kotlin at 2.2.20; AGP 9.x built-in is still 2.2.10 — keep explicit KGP.
# Flutter may warn to migrate to built-in Kotlin; ignore until an AGP ships ≥2.2.20 (or Flutter skips the check).
android.builtInKotlin=false
# Flutter Gradle plugin still casts legacy AbstractAppExtension — opt out of AGP 9 new DSL.
# shortcut: newDsl=false until Flutter supports AGP new DSL, then set true / drop this flag
android.newDsl=false
